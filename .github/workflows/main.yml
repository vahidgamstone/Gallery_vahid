class ConsultationPage extends StatefulWidget {
  const ConsultationPage({super.key});

  @override
  State<ConsultationPage> createState() =>
      _ConsultationPageState();
}

class _ConsultationPageState extends State<ConsultationPage> {
  final nameController = TextEditingController();
  final phoneController = TextEditingController();
  final questionController = TextEditingController();

  List<XFile> images = [];

  Future<void> selectImages() async {
    final picker = ImagePicker();

    final selected = await picker.pickMultiImage(
      imageQuality: 100,
    );

    if (selected.isNotEmpty) {
      setState(() {
        images = selected;
      });
    }
  }

  void submit() {
    if (questionController.text.trim().isEmpty) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(
          content: Text('لطفاً سؤال یا توضیحات را وارد کنید.'),
        ),
      );
      return;
    }

    ScaffoldMessenger.of(context).showSnackBar(
      const SnackBar(
        content: Text(
          'درخواست کارشناسی ثبت شد. کارشناس گالری پس از بررسی پاسخ می‌دهد.',
        ),
      ),
    );

    questionController.clear();
  }

  @override
  Widget build(BuildContext context) {
    return ListView(
      padding: const EdgeInsets.all(18),
      children: [
        const Icon(
          Icons.support_agent,
          size: 70,
        ),
        const SizedBox(height: 10),
        const Center(
          child: Text(
            'کارشناسی و مشاوره',
            style: TextStyle(
              fontSize: 25,
              fontWeight: FontWeight.bold,
            ),
          ),
        ),
        const SizedBox(height: 10),
        const Text(
          'عکس گوهر سنگ خود را ارسال کنید و سؤال یا توضیحات خود را برای کارشناس گالری بنویسید.',
          textAlign: TextAlign.center,
        ),
        const SizedBox(height: 20),
        TextField(
          controller: nameController,
          decoration: const InputDecoration(
            labelText: 'نام',
            border: OutlineInputBorder(),
          ),
        ),
        const SizedBox(height: 12),
        TextField(
          controller: phoneController,
          keyboardType: TextInputType.phone,
          decoration: const InputDecoration(
            labelText: 'شماره تماس',
            border: OutlineInputBorder(),
          ),
        ),
        const SizedBox(height: 12),
        TextField(
          controller: questionController,
          maxLines: 5,
          decoration: const InputDecoration(
            labelText: 'سؤال / توضیحات',
            hintText: 'مثلاً نوع سنگ، طبیعی بودن، ارزش یا ویژگی‌ها...',
            border: OutlineInputBorder(),
          ),
        ),
        const SizedBox(height: 15),
        OutlinedButton.icon(
          onPressed: selectImages,
          icon: const Icon(Icons.add_photo_alternate),
          label: Text(
            images.isEmpty
                ? 'انتخاب عکس گوهر سنگ'
                : '${images.length} عکس انتخاب شده',
          ),
        ),
        const SizedBox(height: 15),
        if (images.isNotEmpty)
          SizedBox(
            height: 90,
            child: ListView.builder(
              scrollDirection: Axis.horizontal,
              itemCount: images.length,
              itemBuilder: (_, index) {
                return Container(
                  width: 90,
                  margin: const EdgeInsets.only(left: 8),
                  decoration: BoxDecoration(
                    borderRadius: BorderRadius.circular(12),
                    border: Border.all(),
                  ),
                  child: const Icon(Icons.image),
                );
              },
            ),
          ),
        const SizedBox(height: 20),
        FilledButton.icon(
          onPressed: submit,
          icon: const Icon(Icons.send),
          label: const Text('ارسال درخواست کارشناسی'),
        ),
      ],
    );
  }
}

