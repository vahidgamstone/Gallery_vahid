class CatalogPage extends StatefulWidget {
  const CatalogPage({super.key});

  @override
  State<CatalogPage> createState() => _CatalogPageState();
}

class _CatalogPageState extends State<CatalogPage> {
  List<Gemstone> gems = [];
  Set<String> favorites = {};
  String search = '';

  @override
  void initState() {
    super.initState();
    load();
  }

  Future<void> load() async {
    final g = await AppData.getGems();
    final f = await AppData.getFavorites();

    if (!mounted) return;

    setState(() {
      gems = g;
      favorites = f;
    });
  }

  Future<void> toggleFavorite(String code) async {
    setState(() {
      if (favorites.contains(code)) {
        favorites.remove(code);
      } else {
        favorites.add(code);
      }
    });

    await AppData.saveFavorites(favorites);
  }

  @override
  Widget build(BuildContext context) {
    final filtered = gems.where((gem) {
      final q = search.trim().toLowerCase();

      if (q.isEmpty) return true;

      return gem.name.toLowerCase().contains(q) ||
          gem.code.toLowerCase().contains(q) ||
          gem.material.toLowerCase().contains(q) ||
          gem.origin.toLowerCase().contains(q);
    }).toList();

    return RefreshIndicator(
      onRefresh: load,
      child: ListView(
        padding: const EdgeInsets.all(16),
        children: [
          TextField(
            onChanged: (value) {
              setState(() {
                search = value;
              });
            },
            decoration: InputDecoration(
              hintText: 'جستجوی نام، کد یا نوع گوهر سنگ...',
              prefixIcon: const Icon(Icons.search),
              border: OutlineInputBorder(
                borderRadius: BorderRadius.circular(16),
              ),
            ),
          ),
          const SizedBox(height: 18),
          const Text(
            'کاتالوگ گوهر سنگ‌ها',
            style: TextStyle(
              fontSize: 22,
              fontWeight: FontWeight.bold,
            ),
          ),
          const SizedBox(height: 12),
          if (filtered.isEmpty)
            const Padding(
              padding: EdgeInsets.all(40),
              child: Center(
                child: Text('موردی پیدا نشد'),
              ),
            ),
          ...filtered.map(
            (gem) => GemCard(
              gem: gem,
              favorite: favorites.contains(gem.code),
              onFavorite: () => toggleFavorite(gem.code),
            ),
          ),
        ],
      ),
    );
  }
}

