class AppThemes {
  static ThemeData theme(int index) {
    if (index == 1) {
      return ThemeData(
        useMaterial3: true,
        brightness: Brightness.dark,
        scaffoldBackgroundColor: const Color(0xFF101812),
        colorScheme: ColorScheme.fromSeed(
          seedColor: Colors.green,
          brightness: Brightness.dark,
        ),
        fontFamily: 'sans',
      );
    }

    if (index == 2) {
      return ThemeData(
        useMaterial3: true,
        brightness: Brightness.dark,
        scaffoldBackgroundColor: const Color(0xFF120C18),
        colorScheme: ColorScheme.fromSeed(
          seedColor: Colors.deepPurple,
          brightness: Brightness.dark,
        ),
        fontFamily: 'sans',
      );
    }

    return ThemeData(
      useMaterial3: true,
      brightness: Brightness.dark,
      scaffoldBackgroundColor: const Color(0xFF080808),
      colorScheme: ColorScheme.fromSeed(
        seedColor: Colors.amber,
        brightness: Brightness.dark,
      ),
      fontFamily: 'sans',
    );
  }
}

class Gemstone {
  String code;
  String name;
  String material;
  String origin;
  String dimensions;
  String description;
  String status;
  List<String> images;

  Gemstone({
    required this.code,
    required this.name,
    required this.material,
    required this.origin,
    required this.dimensions,
    required this.description,
    required this.status,
    this.images = const [],
  });

  Map<String, dynamic> toJson() {
    return {
      'code': code,
      'name': name,
      'material': material,
      'origin': origin,
      'dimensions': dimensions,
      'description': description,
      'status': status,
      'images': images,
    };
  }

  factory Gemstone.fromJson(Map<String, dynamic> json) {
    return Gemstone(
      code: json['code'] ?? '',
      name: json['name'] ?? '',
      material: json['material'] ?? '',
      origin: json['origin'] ?? '',
      dimensions: json['dimensions'] ?? '',
      description: json['description'] ?? '',
      status: json['status'] ?? 'موجود',
      images: List<String>.from(json['images'] ?? []),
    );
  }
}

class AppData {
  static const String gemsKey = 'gems';
  static const String favoritesKey = 'favorites';

  static Future<List<Gemstone>> getGems() async {
    final prefs = await SharedPreferences.getInstance();
    final data = prefs.getStringList(gemsKey);

    if (data == null || data.isEmpty) {
      final gems = demoGems();

      await saveGems(gems);

      return gems;
    }

    return data
        .map((e) => Gemstone.fromJson(jsonDecode(e)))
        .toList();
  }

  static Future<void> saveGems(List<Gemstone> gems) async {
    final prefs = await SharedPreferences.getInstance();

    await prefs.setStringList(
      gemsKey,
      gems.map((e) => jsonEncode(e.toJson())).toList(),
    );
  }

  static Future<Set<String>> getFavorites() async {
    final prefs = await SharedPreferences.getInstance();

    return prefs.getStringList(favoritesKey)?.toSet() ?? {};
  }

  static Future<void> saveFavorites(Set<String> favorites) async {
    final prefs = await SharedPreferences.getInstance();

    await prefs.setStringList(
      favoritesKey,
      favorites.toList(),
    );
  }
}

