  const AdminPage({
    super.key,
    required this.themeIndex,
    required this.onThemeChanged,
  });

  @override
  State<AdminPage> createState() => _AdminPageState();
}

class _AdminPageState extends State<AdminPage> {
  bool unlocked = false;

  @override
  Widget build(BuildContext context) {
    if (!unlocked) {
      return Scaffold(
        appBar: AppBar(
          title: const Text('مدیریت گالری'),
        ),
        body: Center(
          child: FilledButton(
            onPressed: () async {
              final controller = TextEditingController();

              final result = await showDialog<bool>(
                context: context,
                builder: (_) {
                  return AlertDialog(
                    title: const Text('ورود مدیریت'),
                    content: TextField(
                      controller: controller,
                      obscureText: true,
                      keyboardType: TextInputType.number,
                      decoration: const InputDecoration(
                        labelText: 'رمز مدیریت',
                      ),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () =>
                            Navigator.pop(context, false),
                        child: const Text('لغو'),
                      ),
                      FilledButton(
                        onPressed: () {
                          Navigator.pop(
                            context,
                            controller.text == '1234',
                          );
                        },
                        child: const Text('ورود'),
                      ),
                    ],
                  );
                },
              );

              if (result == true) {
                setState(() {
                  unlocked = true;
                });
              }
            },
            child: const Text('ورود به مدیریت'),
          ),
        ),
      );
    }

    return Scaffold(
      appBar: AppBar(
        title: const Text('پنل مدیریت'),
      ),
      body: ListView(
        padding: const EdgeInsets.all(18),
        children: [
          const Text(
            'مدیریت کاتالوگ',
            style: TextStyle(
              fontSize: 24,
              fontWeight: FontWeight.bold,
            ),
          ),
          const SizedBox(height: 15),
          ListTile(
            leading: const Icon(Icons.add_box),
            title: const Text('افزودن گوهر سنگ'),
            subtitle: const Text(
              'ثبت نام، جنس، اصالت، ابعاد و وضعیت',
            ),
            trailing: const Icon(Icons.arrow_back_ios),
            onTap: () {
              Navigator.push(
                context,
                MaterialPageRoute(
                  builder: (_) => const AddGemPage(),
                ),
              );
            },
          ),
          const Divider(),
          ListTile(
            leading: const Icon(Icons.palette),
            title: const Text('قالب ظاهری برنامه'),
            subtitle: Text(
              widget.themeIndex == 0
                  ? 'سلطنتی'
                  : widget.themeIndex == 1
                      ? 'طبیعت'
                      : 'هنری',
            ),
            onTap: () {
              showModalBottomSheet(
                context: context,
                builder: (_) {
                  return Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      ListTile(
                        title: const Text('سلطنتی'),
                        subtitle: const Text(
                          'مشکی + طلایی',
                        ),
                        onTap: () {
                          widget.onThemeChanged(0);
                          Navigator.pop(context);
                        },
                      ),
                      ListTile(
                        title: const Text('طبیعت'),
                        subtitle: const Text(
                          'سبز تیره + رنگ‌های طبیعی',
                        ),
                        onTap: () {
                          widget.onThemeChanged(1);
                          Navigator.pop(context);
                        },
                      ),
                      ListTile(
                        title: const Text('هنری'),
                        subtitle: const Text(
                          'بنفش تیره + مشکی + طلایی',
                        ),
                        onTap: () {
                          widget.onThemeChanged(2);
                          Navigator.pop(context);
                        },
                      ),
                    ],
                  );
                },
              );
            },
          ),
          const Divider(),
          const ListTile(
            leading: Icon(Icons.info_outline),
            title: Text('نسخه برنامه'),
            subtitle: Text('گوهر سنگ وحید - 1.0.0'),
          ),
        ],
      ),
    );
  }
}

class AddGemPage extends StatefulWidget {
  const AddGemPage({super.key});

  @override
  State<AddGemPage> createState() => _AddGemPageState();
}

class _AddGemPageState extends State<AddGemPage> {
  final name = TextEditingController();
  final material = TextEditingController();
  final origin = TextEditingController();
  final dimensions = TextEditingController();
  final description = TextEditingController();

  String status = 'موجود';

  Future<void> save() async {
    if (name.text.trim().isEmpty) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(
          content: Text('نام گوهر سنگ را وارد کنید.'),
        ),
      );
      return;
    }

    final gems = await AppData.getGems();

    final code =
        'GV-${(gems.length + 1).toString().padLeft(4, '0')}';

    gems.add(
      Gemstone(
        code: code,
        name: name.text.trim(),
        material: material.text.trim(),
        origin: origin.text.trim(),
        dimensions: dimensions.text.trim(),
        description: description.text.trim(),
        status: status,
      ),
    );

    await AppData.saveGems(gems);

    if (!mounted) return;

    ScaffoldMessenger.of(context).showSnackBar(
      SnackBar(
        content: Text(
          'گوهر سنگ با کد $code ثبت شد.',
        ),
      ),
    );

    Navigator.pop(context);
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('افزودن گوهر سنگ'),
      ),
      body: ListView(
        padding: const EdgeInsets.all(18),
        children: [
          TextField(
            controller: name,
            decoration: const InputDecoration(
              labelText: 'نام گوهر سنگ',
              border: OutlineInputBorder(),
            ),
          ),
          const SizedBox(height: 12),
          TextField(
            controller: material,
            decoration: const InputDecoration(
              labelText: 'جنس گوهر سنگ',
              border: OutlineInputBorder(),
            ),
          ),
          const SizedBox(height: 12),
          TextField(
            controller: origin,
            decoration: const InputDecoration(
              labelText: 'اصالت / محل',
              border: OutlineInputBorder(),
            ),
          ),
          const SizedBox(height: 12),
          TextField(
            controller: dimensions,
            decoration: const InputDecoration(
              labelText: 'ابعاد',
              border: OutlineInputBorder(),
            ),
          ),
          const SizedBox(height: 12),
          DropdownButtonFormField<String>(
            value: status,
            decoration: const InputDecoration(
              labelText: 'وضعیت',
              border: OutlineInputBorder(),
            ),
            items: const [
              DropdownMenuItem(
                value: 'موجود',
                child: Text('موجود'),
              ),
              DropdownMenuItem(
                value: 'رزرو',
                child: Text('رزرو'),
              ),
              DropdownMenuItem(
                value: 'فروخته‌شده',
                child: Text('فروخته‌شده'),
              ),
            ],
            onChanged: (value) {
              if (value != null) {
                setState(() {
                  status = value;
                });
              }
            },
          ),
          const SizedBox(height: 12),
          TextField(
            controller: description,
            maxLines: 5,
            decoration: const InputDecoration(
              labelText: 'توضیحات',
              border: OutlineInputBorder(),
            ),
          ),
          const SizedBox(height: 20),
          FilledButton.icon(
            onPressed: save,
            icon: const Icon(Icons.save),
            label: const Text('ذخیره گوهر سنگ'),
          ),
        ],
      ),
    );
  }
}
